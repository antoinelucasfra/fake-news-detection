[project]
name = "fake-news-detection"
version = "0.1.0"
description = "Fine-tuning Microsoft Phi-3-mini with LoRA/QLoRA on a public fact-checking dataset (LIAR) for claim verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Antoine Lucas", email = "antoine.lucas.fra@gmail.com" }]
keywords = ["LLM", "fine-tuning", "LoRA", "QLoRA", "PEFT", "Phi-3", "fact-checking", "NLP"]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.19.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
